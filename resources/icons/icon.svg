<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- ProjectManga: an open book on the app's dark background. The left page holds three manga
       panels, the right page lines of text (novels). Colours are the app's own. -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#17181c"/>
  <!-- the two pages -->
  <path d="M124 70 C104 60 74 56 44 60 L44 194 C74 190 104 194 124 204 Z" fill="#ff6b57"/>
  <path d="M132 70 C152 60 182 56 212 60 L212 194 C182 190 152 194 132 204 Z" fill="#ff6b57"/>
  <!-- three panels on the left page -->
  <g fill="none" stroke="#17181c" stroke-width="5" stroke-linejoin="round">
    <path d="M56 74 C76 71 96 73 112 79 L112 116 C96 111 76 109 56 111 Z"/>
    <path d="M56 123 L80 122 L80 180 L56 182 Z"/>
    <path d="M89 122 C97 122 105 124 112 127 L112 189 C105 186 97 184 89 183 Z"/>
  </g>
  <!-- lines of text on the right page -->
  <g stroke="#17181c" stroke-width="6" stroke-linecap="round">
    <line x1="146" y1="88" x2="198" y2="84"/>
    <line x1="146" y1="110" x2="198" y2="106"/>
    <line x1="146" y1="132" x2="198" y2="128"/>
    <line x1="146" y1="154" x2="198" y2="150"/>
    <line x1="146" y1="176" x2="178" y2="174"/>
  </g>
</svg>
